aid: field-ai
name: Field AI
description: >-
  FieldAI builds general-purpose robot intelligence through its Field Foundation
  Models (FFMs) and EDGE brain — a new class of physics-first, risk-aware
  foundation models for embodied AI. FieldAI's embodiment-agnostic autonomy lets
  robots navigate dynamic, unstructured environments without maps, GPS, or
  predefined trajectories, and has been proven across quadrupeds, humanoids,
  wheeled robots, and passenger-scale vehicles. Founded in 2023 (formerly AI for
  Humanity) and based in Mission Viejo, California, the company is led by
  veterans from DeepMind, Google Brain, Tesla Autopilot, NASA JPL, and SpaceX,
  and serves construction, energy, mining, logistics, manufacturing, power and
  utility, agriculture, and federal applications. FieldAI has raised over $405M
  from investors including Bezos Expeditions, Canaan Partners, Khosla Ventures,
  Temasek, Intel Capital, Hyundai Motor Company, and Prysm Capital.
